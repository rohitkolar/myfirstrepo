<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Message Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
            animation: float 12s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .heart1 { left: 10%; top: 20%; animation-delay: 0s; }
        .heart2 { left: 80%; top: 15%; animation-delay: 2s; font-size: 2.5rem; }
        .heart3 { left: 15%; top: 70%; animation-delay: 4s; }
        .gift1 { left: 70%; top: 60%; animation-delay: 1s; font-size: 2.2rem; }
        .gift2 { left: 25%; top: 40%; animation-delay: 3s; }
        .teddy1 { left: 85%; top: 80%; animation-delay: 2.5s; }
        .teddy2 { left: 5%; top: 50%; animation-delay: 1.5s; font-size: 2.3rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-40px) rotate(8deg) scale(1.05); }
            50% { transform: translateY(-80px) rotate(-8deg) scale(0.95); }
            75% { transform: translateY(-40px) rotate(5deg) scale(1.02); }
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 4rem 3rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.7;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .heart-animation {
            font-size: 5rem;
            margin: 2rem 0;
            animation: heartbeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(255, 105, 180, 0.5));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-5deg); }
            50% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }

        .btn {
            padding: 1.25rem 3.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.5);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }

            .welcome-card {
                padding: 3rem 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .heart-animation {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Valentine Icons -->
    <div class="floating-icon heart1">❤️</div>
    <div class="floating-icon heart2">💕</div>
    <div class="floating-icon heart3">💖</div>
    <div class="floating-icon gift1">🎁</div>
    <div class="floating-icon gift2">🎀</div>
    <div class="floating-icon teddy1">🧸</div>
    <div class="floating-icon teddy2">🧸</div>

    <div class="container">
        <div class="welcome-card">
            <h1>Valentine Message Creator</h1>
            <div class="heart-animation">💝</div>
            <p class="subtitle">Create a beautiful personalized Valentine message with your heartfelt words and special memories</p>
            <a href="page1.html" class="btn">Start Creating</a>
        </div>
    </div>
</body>
</html>
