<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Message Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FAF0E6 50%, #FFE8E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }

        .heart1 { left: 10%; top: 20%; animation-delay: 0s; }
        .heart2 { left: 80%; top: 15%; animation-delay: 2s; font-size: 2.5rem; }
        .heart3 { left: 15%; top: 70%; animation-delay: 4s; }
        .gift1 { left: 70%; top: 60%; animation-delay: 1s; font-size: 2.2rem; }
        .gift2 { left: 25%; top: 40%; animation-delay: 3s; }
        .teddy1 { left: 85%; top: 80%; animation-delay: 2.5s; }
        .teddy2 { left: 5%; top: 50%; animation-delay: 1.5s; font-size: 2.3rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(5deg); }
            50% { transform: translateY(-60px) rotate(-5deg); }
            75% { transform: translateY(-30px) rotate(3deg); }
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 4rem 3rem;
            box-shadow: 0 20px 60px rgba(128, 0, 32, 0.15);
            max-width: 600px;
            border: 1px solid rgba(232, 180, 184, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #800020;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            color: #A0153E;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
        }

        .heart-animation {
            font-size: 4rem;
            margin: 2rem 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }

        .btn {
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #A0153E 0%, #800020 100%);
            color: #FFF8E7;
            box-shadow: 0 4px 15px rgba(160, 21, 62, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(160, 21, 62, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.25rem;
            }

            .welcome-card {
                padding: 3rem 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Valentine Icons -->
    <div class="floating-icon heart1">❤️</div>
    <div class="floating-icon heart2">💕</div>
    <div class="floating-icon heart3">💖</div>
    <div class="floating-icon gift1">🎁</div>
    <div class="floating-icon gift2">🎀</div>
    <div class="floating-icon teddy1">🧸</div>
    <div class="floating-icon teddy2">🧸</div>

    <div class="container">
        <div class="welcome-card">
            <h1>Valentine Message Creator</h1>
            <div class="heart-animation">💝</div>
            <p class="subtitle">Create a beautiful personalized Valentine message with your heartfelt words and special memories</p>
            <a href="page1.html" class="btn">Start Creating</a>
        </div>
    </div>
</body>
</html>
