<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Messages - Step 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
            animation: float 12s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .heart1 { left: 10%; top: 20%; animation-delay: 0s; }
        .heart2 { left: 80%; top: 15%; animation-delay: 2s; font-size: 2.5rem; }
        .heart3 { left: 15%; top: 70%; animation-delay: 4s; }
        .gift1 { left: 70%; top: 60%; animation-delay: 1s; font-size: 2.2rem; }
        .gift2 { left: 25%; top: 40%; animation-delay: 3s; }
        .teddy1 { left: 85%; top: 80%; animation-delay: 2.5s; }
        .teddy2 { left: 5%; top: 50%; animation-delay: 1.5s; font-size: 2.3rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-40px) rotate(8deg) scale(1.05); }
            50% { transform: translateY(-80px) rotate(-8deg) scale(0.95); }
            75% { transform: translateY(-40px) rotate(5deg) scale(1.02); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.75rem;
            color: #fff;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #A0153E 0%, #800020 100%);
            color: #FFF8E7;
            box-shadow: 0 4px 15px rgba(160, 21, 62, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(160, 21, 62, 0.4);
        }

        .btn-secondary {
            background: rgba(232, 180, 184, 0.4);
            color: #800020;
            border: 2px solid #E8B4B8;
        }

        .btn-secondary:hover {
            background: rgba(232, 180, 184, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #B76E79;
            font-size: 0.85rem;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .form-card {
                padding: 2rem 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Valentine Icons -->
    <div class="floating-icon heart1">❤️</div>
    <div class="floating-icon heart2">💕</div>
    <div class="floating-icon heart3">💖</div>
    <div class="floating-icon gift1">🎁</div>
    <div class="floating-icon gift2">🎀</div>
    <div class="floating-icon teddy1">🧸</div>
    <div class="floating-icon teddy2">🧸</div>

    <div class="container">
        <div class="form-card">
            <div class="step-indicator">Step 1 of 4</div>
            <h1>Share Your Heart</h1>
            <p class="subtitle">Write three special messages for your loved one</p>

            <form id="messageForm">
                <div class="input-group">
                    <label for="message1">First Message</label>
                    <input type="text" id="message1" placeholder="What makes them special..." maxlength="200">
                </div>

                <div class="input-group">
                    <label for="message2">Second Message</label>
                    <input type="text" id="message2" placeholder="Your favorite memory together..." maxlength="200">
                </div>

                <div class="input-group">
                    <label for="message3">Third Message</label>
                    <input type="text" id="message3" placeholder="A promise for the future..." maxlength="200">
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" id="skipBtn">Skip</button>
                    <button type="submit" class="btn btn-primary" id="nextBtn">Next</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const messages = {
                message1: document.getElementById('message1').value,
                message2: document.getElementById('message2').value,
                message3: document.getElementById('message3').value
            };
            
            localStorage.setItem('valentineMessages', JSON.stringify(messages));
            window.location.href = 'page2.html';
        });

        document.getElementById('skipBtn').addEventListener('click', function() {
            localStorage.setItem('valentineMessages', JSON.stringify({
                message1: '',
                message2: '',
                message3: ''
            }));
            window.location.href = 'page2.html';
        });
    </script>
</body>
</html>
