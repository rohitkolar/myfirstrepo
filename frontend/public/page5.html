<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Slideshow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        /* Heart Animation */
        .heart-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease-in-out 2.5s forwards;
        }

        .big-heart {
            font-size: 15rem;
            animation: heartPulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Slider Container */
        .slider-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .slider {
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
        }

        /* Slide 1 - Message Slide */
        .slide-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        .message-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 4rem 3rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .message-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            color: #fff;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
        }

        .message-item {
            margin-bottom: 2rem;
            opacity: 0;
        }

        .message-item.typing {
            opacity: 1;
        }

        .message-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }

        .message-text {
            font-size: 1.5rem;
            color: #fff;
            line-height: 1.8;
            font-style: italic;
            border-left: 4px solid #f5576c;
            padding-left: 1.5rem;
        }

        .typewriter {
            display: inline;
            border-right: 2px solid #fff;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: #fff; }
            51%, 100% { border-color: transparent; }
        }

        /* Slide 2 - Media Slide */
        .slide-2 {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 50%, #f093fb 100%);
        }

        .media-frame {
            position: relative;
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            padding: 2rem;
            border-radius: 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: slideInUp 1s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .frame-decoration {
            position: absolute;
            font-size: 2.5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        .heart-top-left { top: -20px; left: -20px; }
        .heart-top-right { top: -20px; right: -20px; animation-delay: 0.5s; }
        .heart-bottom-left { bottom: -20px; left: -20px; animation-delay: 1s; }
        .heart-bottom-right { bottom: -20px; right: -20px; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .media-content {
            width: 100%;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .media-content img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
            object-fit: contain;
        }

        .media-content video {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
        }

        .media-content audio {
            width: 100%;
        }

        .no-media-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-style: italic;
        }

        .media-caption {
            text-align: center;
            margin-top: 1.5rem;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Floating Hearts Background */
        .floating-heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: floatAcross 15s linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        @keyframes floatAcross {
            0% {
                transform: translateX(-100px) translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.15;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateX(100vw) translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-heart:nth-child(1) { top: 10%; animation-delay: 0s; }
        .floating-heart:nth-child(2) { top: 30%; animation-delay: 3s; }
        .floating-heart:nth-child(3) { top: 50%; animation-delay: 6s; }
        .floating-heart:nth-child(4) { top: 70%; animation-delay: 9s; }
        .floating-heart:nth-child(5) { top: 90%; animation-delay: 12s; }

        @media (max-width: 768px) {
            .big-heart {
                font-size: 10rem;
            }

            .message-title {
                font-size: 2rem;
            }

            .message-text {
                font-size: 1.2rem;
            }

            .media-frame {
                padding: 1.5rem;
            }

            .frame-decoration {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Heart Intro -->
    <div class="heart-intro">
        <div class="big-heart">💝</div>
    </div>

    <!-- Slider Container -->
    <div class="slider-container">
        <!-- Floating Hearts -->
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💝</div>

        <div class="slider" id="slider">
            <!-- Slide 1: Messages -->
            <div class="slide slide-1">
                <div class="message-container">
                    <h1 class="message-title">My Heart's Messages</h1>
                    <div class="message-item" id="msg1">
                        <div class="message-label">First Message</div>
                        <div class="message-text"><span class="typewriter" id="text1"></span></div>
                    </div>
                    <div class="message-item" id="msg2">
                        <div class="message-label">Second Message</div>
                        <div class="message-text"><span class="typewriter" id="text2"></span></div>
                    </div>
                    <div class="message-item" id="msg3">
                        <div class="message-label">Third Message</div>
                        <div class="message-text"><span class="typewriter" id="text3"></span></div>
                    </div>
                </div>
            </div>

            <!-- Slide 2: Media -->
            <div class="slide slide-2">
                <div class="media-frame">
                    <div class="frame-decoration heart-top-left">💕</div>
                    <div class="frame-decoration heart-top-right">💖</div>
                    <div class="frame-decoration heart-bottom-left">💗</div>
                    <div class="frame-decoration heart-bottom-right">💝</div>
                    
                    <div class="media-content" id="mediaContent">
                        <p class="no-media-text">No media uploaded</p>
                    </div>
                    <p class="media-caption">Forever in my heart ❤️</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load data from localStorage
        const messages = JSON.parse(localStorage.getItem('valentineMessages') || '{}');
        const mediaType = localStorage.getItem('mediaType');
        const mediaFile = JSON.parse(localStorage.getItem('mediaFile') || '{}');

        const msg1 = messages.message1 || "You are my sunshine";
        const msg2 = messages.message2 || "Every day with you is special";
        const msg3 = messages.message3 || "I love you forever";

        let currentSlide = 0;
        let typingComplete = false;

        // Typewriter effect
        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.parentElement.parentElement.classList.add('typing');
            
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.style.borderRight = 'none';
                    if (callback) callback();
                }
            }
            type();
        }

        // Start typing animation after heart intro
        setTimeout(() => {
            typeWriter(msg1, 'text1', 50, () => {
                setTimeout(() => {
                    typeWriter(msg2, 'text2', 50, () => {
                        setTimeout(() => {
                            typeWriter(msg3, 'text3', 50, () => {
                                typingComplete = true;
                                setTimeout(() => {
                                    startSlideshow();
                                }, 2000);
                            });
                        }, 500);
                    });
                }, 500);
            });
        }, 3500);

        // Load media
        function loadMedia() {
            const mediaContent = document.getElementById('mediaContent');
            
            if (mediaType === 'none' || !mediaFile.data) {
                mediaContent.innerHTML = '<p class="no-media-text">Our beautiful memories ✨</p>';
            } else if (mediaType === 'image' && mediaFile.data) {
                const img = document.createElement('img');
                img.src = mediaFile.data;
                img.alt = 'Valentine Memory';
                mediaContent.innerHTML = '';
                mediaContent.appendChild(img);
            } else if (mediaType === 'video' && mediaFile.data) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.src = mediaFile.data;
                mediaContent.innerHTML = '';
                mediaContent.appendChild(video);
            } else if (mediaType === 'audio' && mediaFile.data) {
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.autoplay = true;
                audio.loop = true;
                audio.src = mediaFile.data;
                mediaContent.innerHTML = '';
                mediaContent.appendChild(audio);
            }
        }

        loadMedia();

        // Slideshow
        function startSlideshow() {
            setInterval(() => {
                currentSlide = (currentSlide + 1) % 2;
                const slider = document.getElementById('slider');
                slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            }, 6000);
        }
    </script>
</body>
</html>
