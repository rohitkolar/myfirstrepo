<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Valentine Preview - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FAF0E6 50%, #FFE8E8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }

        .heart1 { left: 10%; top: 20%; animation-delay: 0s; }
        .heart2 { left: 80%; top: 15%; animation-delay: 2s; font-size: 2.5rem; }
        .heart3 { left: 15%; top: 70%; animation-delay: 4s; }
        .gift1 { left: 70%; top: 60%; animation-delay: 1s; font-size: 2.2rem; }
        .gift2 { left: 25%; top: 40%; animation-delay: 3s; }
        .teddy1 { left: 85%; top: 80%; animation-delay: 2.5s; }
        .teddy2 { left: 5%; top: 50%; animation-delay: 1.5s; font-size: 2.3rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(5deg); }
            50% { transform: translateY(-60px) rotate(-5deg); }
            75% { transform: translateY(-30px) rotate(3deg); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(128, 0, 32, 0.15);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(232, 180, 184, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #800020;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #A0153E;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .messages-section {
            margin-bottom: 2.5rem;
            opacity: 1;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-card {
            background: rgba(255, 248, 231, 0.6);
            border-left: 4px solid #B76E79;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            animation: slideIn 0.5s ease-out;
        }

        .message-card:nth-child(1) { animation-delay: 0.2s; opacity: 0; animation-fill-mode: forwards; }
        .message-card:nth-child(2) { animation-delay: 0.4s; opacity: 0; animation-fill-mode: forwards; }
        .message-card:nth-child(3) { animation-delay: 0.6s; opacity: 0; animation-fill-mode: forwards; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message-label {
            font-size: 0.75rem;
            color: #A0153E;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .message-text {
            color: #800020;
            font-size: 1.05rem;
            line-height: 1.6;
            font-style: italic;
        }

        .empty-message {
            color: #B76E79;
            font-style: italic;
            opacity: 0.7;
        }

        .media-section {
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .media-section.show {
            opacity: 1;
        }

        .media-container {
            background: rgba(255, 248, 231, 0.5);
            border: 2px solid #E8B4B8;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-content img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            object-fit: contain;
        }

        .media-content video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
        }

        .media-content audio {
            width: 100%;
        }

        .no-media {
            text-align: center;
            color: #B76E79;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #A0153E 0%, #800020 100%);
            color: #FFF8E7;
            box-shadow: 0 4px 15px rgba(160, 21, 62, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(160, 21, 62, 0.4);
        }

        .btn-secondary {
            background: rgba(232, 180, 184, 0.4);
            color: #800020;
            border: 2px solid #E8B4B8;
        }

        .btn-secondary:hover {
            background: rgba(232, 180, 184, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .heart-animation {
            text-align: center;
            font-size: 3rem;
            margin: 2rem 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #B76E79;
            font-size: 0.85rem;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .preview-card {
                padding: 2rem 1.5rem;
            }

            .message-card {
                padding: 1.25rem;
            }

            .media-container {
                min-height: 250px;
                padding: 1.5rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Valentine Icons -->
    <div class="floating-icon heart1">❤️</div>
    <div class="floating-icon heart2">💕</div>
    <div class="floating-icon heart3">💖</div>
    <div class="floating-icon gift1">🎁</div>
    <div class="floating-icon gift2">🎀</div>
    <div class="floating-icon teddy1">🧸</div>
    <div class="floating-icon teddy2">🧸</div>

    <div class="container">
        <div class="preview-card">
            <div class="step-indicator">Final Preview</div>
            <h1>Your Valentine Message</h1>
            <p class="subtitle">Here's what you've created with love</p>

            <div class="heart-animation">💝</div>

            <div class="messages-section" id="messagesSection">
                <div class="message-card">
                    <div class="message-label">Message 1</div>
                    <div class="message-text" id="message1"></div>
                </div>
                <div class="message-card">
                    <div class="message-label">Message 2</div>
                    <div class="message-text" id="message2"></div>
                </div>
                <div class="message-card">
                    <div class="message-label">Message 3</div>
                    <div class="message-text" id="message3"></div>
                </div>
            </div>

            <div class="media-section" id="mediaSection">
                <div class="media-container">
                    <div class="media-content" id="mediaContent">
                        <div class="no-media">Loading media...</div>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='page1.html'">Create New</button>
                <button type="button" class="btn btn-primary" onclick="window.print()">Print</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='page3.html'">Edit</button>
            </div>
        </div>
    </div>

    <script>
        // Load messages
        const messages = JSON.parse(localStorage.getItem('valentineMessages') || '{}');
        
        document.getElementById('message1').textContent = messages.message1 || 'No message provided';
        document.getElementById('message2').textContent = messages.message2 || 'No message provided';
        document.getElementById('message3').textContent = messages.message3 || 'No message provided';

        if (!messages.message1) document.getElementById('message1').classList.add('empty-message');
        if (!messages.message2) document.getElementById('message2').classList.add('empty-message');
        if (!messages.message3) document.getElementById('message3').classList.add('empty-message');

        // Load media after 2 seconds
        setTimeout(() => {
            const mediaSection = document.getElementById('mediaSection');
            const mediaContent = document.getElementById('mediaContent');
            const mediaType = localStorage.getItem('mediaType');
            const mediaFile = JSON.parse(localStorage.getItem('mediaFile') || '{}');

            mediaSection.classList.add('show');

            if (mediaType === 'none' || !mediaFile.data) {
                mediaContent.innerHTML = '<div class="no-media">No media was added</div>';
            } else if (mediaType === 'image' && mediaFile.data) {
                const img = document.createElement('img');
                img.src = mediaFile.data;
                img.alt = 'Valentine Image';
                mediaContent.innerHTML = '';
                mediaContent.appendChild(img);
            } else if (mediaType === 'video' && mediaFile.data) {
                const video = document.createElement('video');
                video.controls = true;
                video.src = mediaFile.data;
                mediaContent.innerHTML = '';
                mediaContent.appendChild(video);
            } else if (mediaType === 'audio' && mediaFile.data) {
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = mediaFile.data;
                mediaContent.innerHTML = '';
                mediaContent.appendChild(audio);
            } else {
                mediaContent.innerHTML = '<div class="no-media">No media available</div>';
            }
        }, 2000);
    </script>
</body>
</html>
